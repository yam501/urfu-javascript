<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ЛР №1 — Grid</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 10px;
    }

    .grid-container div {
      background: #ddd;
      padding: 20px;
      text-align: center;
    }

    .wide {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <h1>CSS Grid</h1>
  <p><a href="index.html">← На главную</a></p>

  <div class="grid-container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div class="wide">4 (span 2)</div>
    <div>5</div>
  </div>
</body>
</html>
